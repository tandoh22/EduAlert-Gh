<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="badgeClip">
      <rect x="20" y="20" width="160" height="160" rx="36"/>
    </clipPath>
  </defs>

  <!-- Badge -->
  <rect x="20" y="20" width="160" height="160" rx="36" fill="#0A192F"/>

  <g clip-path="url(#badgeClip)">
    <!-- Graduation cap -->
    <polygon points="100,58 138,80 100,102 62,80" fill="#FFFFFF"/>
    <rect x="84" y="96" width="32" height="38" rx="9" fill="#FFFFFF"/>
    <circle cx="100" cy="80" r="5" fill="#10B981"/>
    <path d="M100,80 C112,88 118,98 126,110" stroke="#10B981" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="127" cy="113" r="6" fill="#10B981"/>

    <!-- Early-warning signal -->
    <circle cx="158" cy="44" r="22" fill="none" stroke="#10B981" stroke-width="2.5" opacity="0.28"/>
    <circle cx="158" cy="44" r="14" fill="none" stroke="#10B981" stroke-width="2.5" opacity="0.55"/>
    <circle cx="158" cy="44" r="6" fill="#10B981"/>
  </g>

  <!-- Wordmark -->
  <text x="210" y="115" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="58">
    <tspan fill="#0A192F">Edu</tspan><tspan fill="#10B981">Alert</tspan>
  </text>
  <text x="212" y="146" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="16" letter-spacing="0.4" fill="#64748B">
    Ghana Education Service partner
  </text>
</svg>
